<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Sticky Love</title>

<!-- Elegant Arabic display font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     1. DESIGN TOKENS
  ============================================================ */
  :root {
    --cream:         #FBF3E2;
    --cream-deep:    #F3E6C8;
    --gold-pale:     #EAD6A0;
    --gold:          #D9A85C;
    --gold-deep:     #B8823F;
    --orange-soft:   #D98E52;
    --off-white:     #FFFCF5;
    --ink:           #5C3D21;
    --ink-soft:      #8A6A45;
    --glow-rgb:      255, 232, 186;
    --shadow-rgb:    120, 82, 34;

    --sky-top:       #F6E2C6;
    --sun-core:      #FFF6DE;
    --sun-mid:       #F9CE7C;
    --sun-edge:      #E39A55;
    --moon-body:     #FBF3DE;
    --moon-shade:    #E4CDA0;
    --star-color:    255, 250, 235;
    --planet-a:      #D98E6B;
    --planet-a-ring: #E8B98C;
    --planet-b:      #C9A66B;
    --planet-b-ring: #EBD9A9;
    --planet-c:      #B98A82;
    --planet-c-ring: #E7C9B9;

    --dune-back:       #EFCB9C;
    --dune-mid:        #E0A96E;
    --dune-front:      #C9814A;
    --dune-front-deep: #9E5F32;
    --accent-signature:#C9683B;

    --font-arabic: 'Amiri', 'Traditional Arabic', 'Arial', serif;
    --font-arabic-display: 'Aref Ruqaa', 'Amiri', serif;

    --ease-cinematic: cubic-bezier(.22,1,.36,1);
    --t-flap:  1.45s;
    --t-paper: 1.75s;
    --t-text:  1.35s;
    --t-glow:  3.2s;
  }

  @media (prefers-reduced-motion: reduce){
    :root {
      --t-flap: .01s; --t-paper: .01s; --t-text: .01s; --t-glow: .01s;
    }
  }

  /* ============================================================
     2. BASE / RESET
  ============================================================ */
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }
  body {
    position: relative;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg,
        #F3DCC2 0%,
        #F6E4C9 22%,
        #F8EAD3 42%,
        #FBEFD9 58%,
        #F2CE9E 78%,
        var(--accent-signature) 100%);
    font-family: var(--font-arabic);
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    user-select: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    box-shadow: inset 0 0 18vw rgba(120, 66, 30, .16);
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 21;
    pointer-events: none;
    opacity: .05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .ambient-wash {
    position: fixed;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    filter: blur(70px);
    opacity: .4;
    background:
      radial-gradient(circle at 22% 28%, rgba(233,178,140,.55), transparent 42%),
      radial-gradient(circle at 78% 18%, rgba(217,168,92,.4), transparent 45%),
      radial-gradient(circle at 60% 82%, rgba(201,129,74,.35), transparent 50%);
    animation: wash-drift 38s ease-in-out infinite alternate;
  }
  @keyframes wash-drift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(2.5%,-2%) scale(1.06); }
  }

  .sun-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle at 50% 42%,
                  rgba(var(--glow-rgb), .65) 0%,
                  rgba(var(--glow-rgb), .28) 30%,
                  rgba(var(--glow-rgb), 0) 65%);
    opacity: .55;
    transition: opacity var(--t-glow) ease;
    animation: breathe 12s ease-in-out infinite;
  }
  body.opened .sun-glow { opacity: 1; }

  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ============================================================
     3. ANIMATED CELESTIAL BACKGROUND
  ============================================================ */
  .sky-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .stars {
    position: absolute;
    inset: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: rgba(var(--star-color), 1);
    box-shadow: 0 0 4px rgba(var(--star-color), .8);
    animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: var(--star-min, .15); transform: scale(.85); }
    100% { opacity: var(--star-max, .9); transform: scale(1.2); }
  }

  /* SUN ORBIT ANIMATION: Sun moves in a continuous smooth arc */
  .sun-orbit-container {
    position: fixed;
    bottom: 12vh;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 1;
    animation: sun-float-path 34s ease-in-out infinite alternate;
  }

  @keyframes sun-float-path {
    0% { transform: translate(-50%, 0) rotate(-4deg); }
    50% { transform: translate(-50%, -18px) rotate(3deg); }
    100% { transform: translate(-50%, 8px) rotate(-2deg); }
  }

  .sun-orb-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(180px, 36vw, 320px);
    height: clamp(180px, 36vw, 320px);
    transform: translate(-50%, -50%) translate(var(--px, 0px), var(--py, 0px));
  }

  /* Rotating outer sun rays */
  .sun-rays {
    position: absolute;
    inset: -90%;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(249, 206, 124, .45) 0deg 5deg,
      rgba(249, 206, 124, 0) 5deg 20deg
    );
    filter: blur(2px);
    animation: spin-sun 75s linear infinite;
    opacity: .8;
  }

  /* Secondary counter-rotating inner rays */
  .sun-rays-inner {
    position: absolute;
    inset: -50%;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 10deg,
      rgba(255, 232, 186, .35) 0deg 8deg,
      transparent 8deg 24deg
    );
    filter: blur(1px);
    animation: spin-sun-reverse 52s linear infinite;
    opacity: .7;
  }

  .sun-corona {
    position: absolute;
    inset: -40%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,246,222,.95) 0%, rgba(249,206,124,.4) 45%, rgba(249,206,124,0) 75%);
    animation: breathe 8s ease-in-out infinite;
  }

  .sun-core {
    position: absolute;
    inset: 20%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--sun-core) 0%, var(--sun-mid) 55%, var(--sun-edge) 100%);
    box-shadow: 0 0 50px rgba(249,206,124,.7), inset 0 0 20px rgba(255,255,255,.8);
    animation: sun-pulse 7s ease-in-out infinite alternate;
  }

  @keyframes spin-sun {
    to { transform: rotate(360deg); }
  }
  @keyframes spin-sun-reverse {
    to { transform: rotate(-360deg); }
  }
  @keyframes sun-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    100% { transform: scale(1.04); filter: brightness(1.1); }
  }

  body.opened .sun-corona { animation-duration: 3.5s; }
  body.opened .sun-rays { opacity: 1; }

  /* MOON ANIMATION */
  .moon-wrap {
    position: absolute;
    top: 10%;
    right: 10%;
    width: clamp(50px, 11vw, 85px);
    height: clamp(50px, 11vw, 85px);
    opacity: .9;
    transform: translate(var(--px, 0px), var(--py, 0px));
  }
  .moon-drift {
    position: absolute;
    inset: 0;
    animation: float-moon 18s ease-in-out infinite alternate;
  }
  .moon-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, var(--moon-body) 0%, var(--moon-shade) 75%);
    box-shadow: 0 0 25px rgba(251,243,222,.65);
    animation: moon-glow 9s ease-in-out infinite alternate;
  }
  .moon-shadow {
    position: absolute;
    top: -6%;
    left: 24%;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--sky-top);
    opacity: .92;
  }

  @keyframes float-moon {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-14px) rotate(-6deg); }
  }
  @keyframes moon-glow {
    0% { box-shadow: 0 0 15px rgba(251,243,222,.4); }
    100% { box-shadow: 0 0 30px rgba(251,243,222,.8); }
  }

  /* PLANETS WITH ROTATING RINGS & FLOAT ANIMATION */
  .planet {
    position: absolute;
    transform: translate(var(--px, 0px), var(--py, 0px));
  }
  .planet-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: float-planet var(--float-dur, 20s) ease-in-out infinite alternate;
  }
  .planet-ring {
    position: absolute;
    inset: -45% -12%;
    border-radius: 50%;
    border-top: 2.5px solid var(--ring-color, rgba(255,255,255,.6));
    border-bottom: 2px solid transparent;
    transform: rotate(-22deg) scaleY(.38);
    opacity: .85;
    animation: rotate-ring 34s linear infinite;
  }

  .planet.a { top: 58%; left: 7%; width: clamp(34px, 7vw, 52px); height: clamp(34px, 7vw, 52px); }
  .planet.b { top: 14%; left: 78%; width: clamp(24px, 5vw, 36px); height: clamp(24px, 5vw, 36px); }
  .planet.c { top: 32%; left: 5%; width: clamp(28px, 6vw, 42px); height: clamp(28px, 6vw, 42px); }

  .planet.a .planet-body {
    background: radial-gradient(circle at 35% 30%, #F1B98F, var(--planet-a) 75%);
    box-shadow: inset -6px -6px 14px rgba(0,0,0,.18), 0 0 20px rgba(217,142,107,.4);
    --ring-color: var(--planet-a-ring);
    --float-dur: 22s;
  }
  .planet.b .planet-body {
    background: radial-gradient(circle at 35% 30%, #E9D6A6, var(--planet-b) 75%);
    box-shadow: inset -5px -5px 10px rgba(0,0,0,.15), 0 0 16px rgba(201,166,107,.4);
    --ring-color: var(--planet-b-ring);
    --float-dur: 28s;
  }
  .planet.c .planet-body {
    background: radial-gradient(circle at 35% 30%, #E4C3BA, var(--planet-c) 75%);
    box-shadow: inset -5px -5px 12px rgba(0,0,0,.15), 0 0 18px rgba(185,138,130,.35);
    --ring-color: var(--planet-c-ring);
    --float-dur: 25s;
  }

  @keyframes float-planet {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(10px, -18px) scale(1.05); }
  }
  @keyframes rotate-ring {
    0% { transform: rotate(-22deg) scaleY(.38); }
    50% { transform: rotate(-15deg) scaleY(.42); }
    100% { transform: rotate(-22deg) scaleY(.38); }
  }

  /* SHOOTING STARS */
  .shooting-star {
    position: absolute;
    top: 12%;
    left: 60%;
    width: 2px;
    height: 2px;
    background: rgba(var(--star-color), 1);
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(var(--star-color), .9);
    opacity: 0;
    animation: shoot 11s ease-in linear infinite;
  }
  .shooting-star::before {
    content: "";
    position: absolute;
    top: 50%; right: 0;
    width: 80px; height: 1.5px;
    background: linear-gradient(90deg, rgba(var(--star-color),.9), transparent);
    transform: translateY(-50%);
  }
  .shooting-star.s2 { top: 28%; left: 25%; animation-delay: 3.5s; animation-duration: 14s; }
  .shooting-star.s3 { top: 8%;  left: 45%; animation-delay: 6.8s; animation-duration: 17s; }

  @keyframes shoot {
    0% { opacity:0; transform: translate(0,0) rotate(22deg); }
    2% { opacity:1; }
    12% { opacity:0; transform: translate(-180px, 100px) rotate(22deg); }
    100% { opacity:0; }
  }

  /* DUNES / LANDSCAPE */
  .horizon {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 40vh;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .horizon-glow {
    position: absolute;
    left: 50%; bottom: 0;
    width: 140%;
    height: 70%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 100%, rgba(255,232,186,.65) 0%, rgba(249,206,124,.25) 40%, transparent 72%);
    mix-blend-mode: screen;
  }
  .dune {
    position: absolute;
    left: -5%; right: -5%; bottom: 0;
  }
  .dune.d1 {
    height: 72%; opacity: .55;
    background: linear-gradient(180deg, rgba(239,203,156,0) 0%, var(--dune-back) 100%);
    clip-path: polygon(0% 100%,0% 46%,9% 40%,20% 50%,32% 34%,45% 46%,58% 28%,71% 42%,84% 24%,94% 38%,100% 30%,100% 100%);
  }
  .dune.d2 {
    height: 52%; opacity: .8;
    background: linear-gradient(180deg, var(--dune-mid) 0%, var(--dune-front) 100%);
    clip-path: polygon(0% 100%,0% 58%,12% 50%,24% 62%,38% 44%,52% 60%,66% 40%,80% 56%,90% 46%,100% 54%,100% 100%);
  }
  .dune.d3 {
    height: 32%; opacity: 1;
    background: linear-gradient(180deg, var(--dune-front) 0%, var(--dune-front-deep) 100%);
    clip-path: polygon(0% 100%,0% 66%,15% 58%,30% 70%,46% 54%,62% 68%,78% 50%,90% 64%,100% 56%,100% 100%);
  }

  /* ============================================================
     4. STAGE & INTERACTIVE ENVELOPE / LETTER
  ============================================================ */
  .stage {
    position: relative;
    z-index: 5;
    width: min(92vw, 480px);
    height: min(92vw, 480px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
    cursor: default;
  }

  .envelope-wrap {
    position: relative;
    width: min(80vw, 350px);
    aspect-ratio: 3 / 2;
    transform-style: preserve-3d;
    transition: transform 1.1s var(--ease-cinematic);
  }

  .stage:hover .envelope-wrap {
    transform: translateY(-4px) scale(1.02);
  }

  .envelope-wrap::before {
    content: "";
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--glow-rgb), .6) 0%, rgba(var(--glow-rgb), 0) 70%);
    opacity: .5;
    transition: opacity var(--t-glow) ease, transform var(--t-glow) ease;
    z-index: 0;
  }
  body.opened .envelope-wrap::before {
    opacity: 1;
    transform: scale(1.2);
  }

  /* ENVELOPE FACE */
  .envelope-face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--cream) 0%, var(--gold-pale) 100%);
    box-shadow:
      0 4px 10px rgba(var(--shadow-rgb), .12),
      0 20px 45px rgba(var(--shadow-rgb), .25),
      inset 0 0 0 1px rgba(255,255,255,.5);
    z-index: 2;
    overflow: hidden;
  }
  .envelope-face::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.3), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(184,130,63,.15), transparent 45%);
  }
  .envelope-face::before {
    content: "";
    position: absolute;
    left: 6%; right: 6%; bottom: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,130,63,.35), transparent);
  }

  /* FLAP */
  .flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 64%;
    clip-path: polygon(0 0, 100% 0, 50% 92%);
    transform-origin: 50% 0%;
    transform-style: preserve-3d;
    transition: transform var(--t-flap) var(--ease-cinematic);
    z-index: 4;
    will-change: transform;
  }
  .flap-front, .flap-back {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    clip-path: polygon(0 0, 100% 0, 50% 92%);
  }
  .flap-front {
    background: linear-gradient(200deg, var(--gold-pale) 0%, var(--gold) 100%);
    box-shadow: inset 0 -14px 24px -14px rgba(var(--shadow-rgb),.28);
  }
  .flap-back {
    background: linear-gradient(200deg, var(--cream) 0%, var(--gold-pale) 90%);
    transform: rotateX(180deg);
  }
  body.opened .flap {
    transform: rotateX(-160deg);
  }

  /* THE LETTER / PAPER */
  .paper {
    position: absolute;
    left: 50%; top: 50%;
    width: 88%;
    min-height: 122%;
    padding: clamp(22px, 6vw, 42px) clamp(18px, 5vw, 34px);
    background: linear-gradient(175deg, var(--off-white) 0%, var(--cream) 100%);
    border-radius: 6px;
    box-shadow:
      0 4px 8px rgba(var(--shadow-rgb), .1),
      0 35px 65px rgba(var(--shadow-rgb), .32);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 3;
    opacity: 0;
    transform: translate(-50%, -46%) translateZ(-60px) scale(.88) rotateX(-6deg);
    transition:
      opacity calc(var(--t-paper) * .4) ease-out,
      transform var(--t-paper) var(--ease-cinematic);
    pointer-events: none;
  }

  body.opened .paper {
    opacity: 1;
    z-index: 10;
    transform: translate(-50%, -86%) translateZ(70px) scale(1) rotateX(0deg);
    transition-delay: 0s, .15s;
    pointer-events: auto;
  }

  .paper::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 6px;
    background:
      radial-gradient(circle at 15% 20%, rgba(217,168,92,.12), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(217,168,92,.12), transparent 40%);
    pointer-events: none;
  }

  .poem {
    direction: rtl;
    font-family: var(--font-arabic-display);
    color: var(--ink);
    font-size: clamp(18px, 3.8vw, 26px);
    font-weight: 700;
    line-height: 2.1;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity var(--t-text) ease, transform var(--t-text) var(--ease-cinematic);
    transition-delay: 0s;
  }
  body.opened .poem {
    opacity: 1;
    transform: translateY(0);
    transition-delay: .72s;
  }
  .poem span { display: block; }
  .poem span + span { margin-top: .6em; }

  /* Hint text inside or near letter */
  .close-hint {
    margin-top: 15px;
    font-size: 13px;
    color: var(--ink-soft);
    opacity: 0.8;
    font-family: var(--font-arabic);
  }

  /* GOLDEN SEAL / BUTTON */
  .seal-btn {
    all: unset;
    position: absolute;
    top: 50%; left: 50%;
    width: clamp(48px, 13vw, 62px);
    height: clamp(48px, 13vw, 62px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    cursor: pointer;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.5s var(--ease-cinematic),
                opacity 0.4s ease,
                filter .3s ease;
  }
  .seal-btn::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--orange-soft) 0%, var(--gold-deep) 55%, #9c6a2e 100%);
    box-shadow:
      0 4px 10px rgba(var(--shadow-rgb), .4),
      inset 0 1px 2px rgba(255,255,255,.5);
  }
  .seal-btn::after {
    content: "☀";
    position: relative;
    color: rgba(255,247,230,.95);
    font-size: 18px;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  .seal-btn:hover {
    transform: translate(-50%, -50%) scale(1.12);
  }

  body:not(.opened) .seal-btn {
    animation: seal-pulse 2.8s ease-in-out infinite;
  }
  @keyframes seal-pulse {
    0%,100% { filter: drop-shadow(0 0 0 rgba(217,142,82,0)); transform: translate(-50%, -50%) scale(1); }
    50% { filter: drop-shadow(0 0 12px rgba(217,142,82,.65)); transform: translate(-50%, -50%) scale(1.05); }
  }

  body.opened .seal-btn {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -180%) rotate(90deg) scale(.5);
  }


  /* ============================================================
     LOCAL MUSIC PLAYER
     The audio file must be named exactly: 1.mp3
  ============================================================ */
  var audio = document.getElementById('audio');
  var musicPlayer = document.getElementById('musicPlayer');
  var playPause = document.getElementById('playPause');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var back10 = document.getElementById('back10');
  var forward10 = document.getElementById('forward10');
  var progress = document.getElementById('progress');
  var volume = document.getElementById('volume');
  var currentTimeEl = document.getElementById('currentTime');
  var durationEl = document.getElementById('duration');

  audio.volume = 0.55;

  function formatTime(seconds) {
    if(!isFinite(seconds) || seconds < 0) return '0:00';
    var mins = Math.floor(seconds / 60);
    var secs = Math.floor(seconds % 60).toString().padStart(2, '0');
    return mins + ':' + secs;
  }

  function updatePlayState() {
    var isPlaying = !audio.paused;
    musicPlayer.classList.toggle('playing', isPlaying);
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
    playPause.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  function updateProgress() {
    currentTimeEl.textContent = formatTime(audio.currentTime);
    durationEl.textContent = formatTime(audio.duration);

    if(isFinite(audio.duration) && audio.duration > 0) {
      progress.value = Math.round((audio.currentTime / audio.duration) * 1000);
    }
  }

  playPause.addEventListener('click', function(e) {
    e.stopPropagation();
    if(audio.paused) {
      audio.play().catch(function(){});
    } else {
      audio.pause();
    }
  });

  back10.addEventListener('click', function(e) {
    e.stopPropagation();
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  forward10.addEventListener('click', function(e) {
    e.stopPropagation();
    if(isFinite(audio.duration)) {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    } else {
      audio.currentTime += 10;
    }
  });

  progress.addEventListener('input', function(e) {
    e.stopPropagation();
    if(isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
    }
  });

  volume.addEventListener('input', function(e) {
    e.stopPropagation();
    audio.volume = Number(volume.value) / 100;
  });

  ['click','pointerdown','mousedown','touchstart'].forEach(function(eventName) {
    musicPlayer.addEventListener(eventName, function(e) {
      e.stopPropagation();
    });
  });

  audio.addEventListener('play', updatePlayState);
  audio.addEventListener('pause', updatePlayState);
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('loadedmetadata', updateProgress);
  audio.addEventListener('durationchange', updateProgress);
  audio.addEventListener('ended', function() {
    updatePlayState();
    progress.value = 0;
  });

  updatePlayState();

  /* DUST PARTICLES */
  .particles {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  body.opened .particles { opacity: 1; }

  .mote {
    position: absolute;
    bottom: -4%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,244,214,.95), rgba(217,168,92,0));
    animation: float-up var(--duration, 6s) ease-in-out infinite;
  }
  @keyframes float-up {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: .9; }
    50% { transform: translateY(-55vh) translateX(var(--drift, 15px)); }
    85% { opacity: .4; }
    100% { transform: translateY(-100vh) translateX(0); opacity: 0; }
  }


  /* ============================================================
     5.5 GLASS MUSIC PLAYER
     Single local audio file: 1.mp3
  ============================================================ */
  .music-player {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 30;
    width: min(92vw, 430px);
    padding: 12px 14px 13px;
    border: 1px solid rgba(255,255,255,.42);
    border-radius: 22px;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,.28),
      rgba(255,244,220,.15)
    );
    box-shadow:
      0 14px 38px rgba(91,57,28,.18),
      inset 0 1px 0 rgba(255,255,255,.45);
    backdrop-filter: blur(18px) saturate(125%);
    -webkit-backdrop-filter: blur(18px) saturate(125%);
    color: #5c3d21;
    user-select: none;
  }

  .music-player::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(120deg, rgba(255,255,255,.16), transparent 42%, rgba(255,255,255,.06));
  }

  .music-top {
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
  }

  .music-disc {
    width:34px;
    height:34px;
    flex:0 0 34px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 35% 30%, #fff6df 0 8%, #d9a85c 9% 42%, #b8823f 43% 100%);
    box-shadow: 0 3px 10px rgba(120,82,34,.22);
    transition: transform .8s ease;
  }

  .music-disc::after {
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff7e7;
    box-shadow:0 0 0 3px rgba(184,130,63,.35);
  }

  .music-player.playing .music-disc {
    animation: disc-spin 7s linear infinite;
  }

  @keyframes disc-spin {
    to { transform:rotate(360deg); }
  }

  .music-meta {
    min-width:0;
    flex:1;
    text-align:left;
    direction:ltr;
  }

  .music-title {
    font-family: Inter, Arial, sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:#684625;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .music-subtitle {
    margin-top:2px;
    font-family: Inter, Arial, sans-serif;
    font-size:10px;
    color:rgba(92,61,33,.68);
  }

  .music-time {
    font-family: Inter, Arial, sans-serif;
    font-size:10px;
    color:rgba(92,61,33,.72);
    direction:ltr;
    white-space:nowrap;
  }

  .music-progress {
    width:100%;
    height:4px;
    appearance:none;
    -webkit-appearance:none;
    border-radius:99px;
    outline:none;
    cursor:pointer;
    background:rgba(107,74,43,.16);
    margin:0 0 10px;
  }

  .music-progress::-webkit-slider-thumb {
    appearance:none;
    -webkit-appearance:none;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#b8823f;
    border:2px solid rgba(255,252,245,.9);
    box-shadow:0 2px 7px rgba(91,57,28,.22);
  }

  .music-progress::-moz-range-thumb {
    width:11px;
    height:11px;
    border-radius:50%;
    background:#b8823f;
    border:2px solid rgba(255,252,245,.9);
    box-shadow:0 2px 7px rgba(91,57,28,.22);
  }

  .music-controls {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }

  .music-btn {
    all:unset;
    width:32px;
    height:32px;
    border-radius:50%;
    display:grid;
    place-items:center;
    cursor:pointer;
    color:#684625;
    background:rgba(255,252,245,.24);
    border:1px solid rgba(255,255,255,.34);
    box-shadow:0 4px 12px rgba(91,57,28,.08), inset 0 1px 0 rgba(255,255,255,.35);
    transition:
      transform .35s cubic-bezier(.22,1,.36,1),
      background .35s ease,
      box-shadow .35s ease;
  }

  .music-btn:hover {
    transform:translateY(-2px) scale(1.04);
    background:rgba(255,252,245,.42);
    box-shadow:0 7px 18px rgba(91,57,28,.13), inset 0 1px 0 rgba(255,255,255,.48);
  }

  .music-btn:active {
    transform:scale(.94);
  }

  .music-btn.main {
    width:42px;
    height:42px;
    font-size:16px;
    background:rgba(255,249,232,.45);
  }

  .music-btn svg {
    width:15px;
    height:15px;
    fill:currentColor;
  }

  .volume-wrap {
    display:flex;
    align-items:center;
    gap:7px;
    margin-left:5px;
    padding-left:9px;
    border-left:1px solid rgba(107,74,43,.13);
  }

  .volume-icon {
    width:15px;
    height:15px;
    color:#684625;
    opacity:.82;
  }

  .volume-slider {
    width:70px;
    height:3px;
    appearance:none;
    -webkit-appearance:none;
    border-radius:99px;
    background:rgba(107,74,43,.16);
    outline:none;
    cursor:pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    appearance:none;
    -webkit-appearance:none;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#b8823f;
    border:2px solid rgba(255,252,245,.9);
  }

  .volume-slider::-moz-range-thumb {
    width:10px;
    height:10px;
    border-radius:50%;
    background:#b8823f;
    border:2px solid rgba(255,252,245,.9);
  }

  @media (max-width: 520px) {
    .music-player {
      width:calc(100vw - 24px);
      bottom:max(10px, env(safe-area-inset-bottom));
      border-radius:19px;
      padding:10px 11px 11px;
    }
    .music-title { font-size:11px; }
    .volume-wrap { margin-left:2px; padding-left:6px; }
    .volume-slider { width:52px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .music-player.playing .music-disc { animation:none; }
  }

  /* RESPONSIVE */
  @media (max-width: 420px){
    .poem { line-height: 1.9; }
    .moon-wrap { top: 8%; right: 6%; }
  }
</style>
</head>
<body>

  <div class="ambient-wash"></div>
  <div class="sun-glow"></div>

  <!-- CELESTIAL BACKGROUND -->
  <div class="sky-layer" id="skyLayer" aria-hidden="true">
    
    <!-- SUN CONTAINER WITH SMOOTH CONTINUOUS MOVEMENT -->
    <div class="sun-orbit-container">
      <div class="sun-orb-wrap" id="sunOrb">
        <div class="sun-rays"></div>
        <div class="sun-rays-inner"></div>
        <div class="sun-corona"></div>
        <div class="sun-core"></div>
      </div>
    </div>

    <!-- MOON -->
    <div class="moon-wrap" id="moonOrb">
      <div class="moon-drift">
        <div class="moon-body"></div>
        <div class="moon-shadow"></div>
      </div>
    </div>

    <!-- PLANETS WITH ROTATING RINGS -->
    <div class="planet a" id="planetA">
      <div class="planet-body">
        <div class="planet-ring"></div>
      </div>
    </div>
    <div class="planet b" id="planetB">
      <div class="planet-body">
        <div class="planet-ring"></div>
      </div>
    </div>
    <div class="planet c" id="planetC">
      <div class="planet-body">
        <div class="planet-ring"></div>
      </div>
    </div>

    <!-- SHOOTING STARS -->
    <div class="shooting-star"></div>
    <div class="shooting-star s2"></div>
    <div class="shooting-star s3"></div>

    <!-- STARS -->
    <div class="stars" id="stars"></div>
  </div>

  <!-- LANDSCAPE DUNES -->
  <div class="horizon" aria-hidden="true">
    <div class="horizon-glow"></div>
    <div class="dune d1"></div>
    <div class="dune d2"></div>
    <div class="dune d3"></div>
  </div>

  <div class="vignette"></div>
  <div class="grain"></div>


  <!-- ============================================================
       GLASS MUSIC PLAYER
       Put 1.mp3 next to index.html
  ============================================================ -->
  <div class="music-player" id="musicPlayer" aria-label="Music player">
    <div class="music-top">
      <div class="music-disc" aria-hidden="true"></div>
      <div class="music-meta">
        <div class="music-title">Our Sticky Love</div>
        <div class="music-subtitle">a little song for us</div>
      </div>
      <div class="music-time">
        <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
      </div>
    </div>

    <input class="music-progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Seek">

    <div class="music-controls">
      <button class="music-btn" id="back10" type="button" aria-label="Back 10 seconds" title="Back 10s">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.5 5a7 7 0 1 1-6.4 4H3.5l3.7-4 3.7 4H8.1A5 5 0 1 0 12.5 7c1.2 0 2.3.4 3.2 1.1l1.2-1.6A7 7 0 0 0 12.5 5Z"/>
          <text x="12" y="16" text-anchor="middle" font-size="6.2" font-family="Arial" fill="currentColor">10</text>
        </svg>
      </button>

      <button class="music-btn main" id="playPause" type="button" aria-label="Play" title="Play / Pause">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10-6.8c.6-.4.6-1.2 0-1.6l-10-6.8C8.8 4.1 8 4.5 8 5.2Z"/>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
          <path d="M7 5h3.4v14H7V5Zm6.6 0H17v14h-3.4V5Z"/>
        </svg>
      </button>

      <button class="music-btn" id="forward10" type="button" aria-label="Forward 10 seconds" title="Forward 10s">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11.5 5a7 7 0 1 0 6.4 4h2.6l-3.7-4-3.7 4h2.8A5 5 0 1 1 11.5 7c-1.2 0-2.3.4-3.2 1.1L7.1 6.5A7 7 0 0 1 11.5 5Z"/>
          <text x="12" y="16" text-anchor="middle" font-size="6.2" font-family="Arial" fill="currentColor">10</text>
        </svg>
      </button>

      <div class="volume-wrap">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.2v2.1A7.5 7.5 0 0 1 20 12a7.5 7.5 0 0 1-3.5 6.1v2.1A9.5 9.5 0 0 0 22 12a9.5 9.5 0 0 0-5.5-8.2Z"/>
        </svg>
        <input class="volume-slider" id="volume" type="range" min="0" max="100" value="55" aria-label="Volume">
      </div>
    </div>

    <audio id="audio" preload="metadata">
      <source src="1.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- INTERACTIVE STAGE -->
  <div class="stage" id="mainStage" title="انقر لفتح أو إغلاق الرسالة">
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="envelope-wrap" id="envelopeWrap">

      <div class="envelope-face"></div>

      <div class="paper" id="paper">
        <p class="poem">
          <span>وَلَوْ حَاوَلُوا إِطْفَاءَ نُورِكِ سَاعَةً سَتَبْقَيْنَ شَمْسًا فِي السَّمَاءِ وَكَوْكَبَا</span>
          <span>يَغَارُ الضِّيَاءُ الْعَذْبُ مِنْكِ لِأَنَّهُ يَرَى فِيكِ فَجْرًا سَاطِعًا لَنْ يَغْرُبَا</span>
        </p>
        <div class="close-hint">click anywhere to close</div>
      </div>

      <div class="flap" id="flap">
        <div class="flap-back"></div>
        <div class="flap-front"></div>
      </div>

      <button class="seal-btn" id="sealBtn" aria-label="افتح الرسالة"></button>

    </div>
  </div>

<script>
(function(){
  "use strict";

  var body = document.body;
  var mainStage = document.getElementById('mainStage');
  var particlesWrap = document.getElementById('particles');
  var opened = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* TOGGLE OPEN / CLOSE FUNCTIONALITY */
  function toggleLetter(e){
    // Prevent button bubbling double trigger
    if(e) e.stopPropagation();

    opened = !opened;

    if(opened) {
      body.classList.add('opened');
      if(particlesWrap.children.length === 0) {
        spawnParticles();
      }
    } else {
      body.classList.remove('opened');
    }
  }

  /* Click anywhere on stage or document when opened toggles back */
  mainStage.addEventListener('click', toggleLetter);
  
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Escape'){
      e.preventDefault();
      toggleLetter();
    }
  });

  /* DUST PARTICLES */
  function spawnParticles(){
    var count = window.innerWidth < 500 ? 14 : 22;
    for(var i = 0; i < count; i++){
      var mote = document.createElement('span');
      mote.className = 'mote';
      var left = Math.random() * 100;
      var duration = 5 + Math.random() * 5;
      var delay = Math.random() * 5;
      var drift = (Math.random() * 30 - 15).toFixed(0) + 'px';
      var size = (2 + Math.random() * 3.5).toFixed(1) + 'px';
      
      mote.style.left = left + '%';
      mote.style.width = size;
      mote.style.height = size;
      mote.style.setProperty('--duration', duration + 's');
      mote.style.animationDelay = delay + 's';
      mote.style.setProperty('--drift', drift);
      particlesWrap.appendChild(mote);
    }
  }

  /* STARS GENERATION */
  var starsWrap = document.getElementById('stars');
  function spawnStars(count){
    var frag = document.createDocumentFragment();
    for(var i = 0; i < count; i++){
      var star = document.createElement('span');
      star.className = 'star';
      var size = (1.2 + Math.random() * 2).toFixed(1) + 'px';
      var top = (Math.random() * 90).toFixed(1) + '%';
      var left = (Math.random() * 100).toFixed(1) + '%';
      var duration = (2 + Math.random() * 3.5).toFixed(1) + 's';
      var delay = (Math.random() * 4).toFixed(1) + 's';
      var minOp = (0.1 + Math.random() * 0.25).toFixed(2);
      var maxOp = (0.6 + Math.random() * 0.4).toFixed(2);
      
      star.style.width = size;
      star.style.height = size;
      star.style.top = top;
      star.style.left = left;
      star.style.setProperty('--duration', duration);
      star.style.animationDelay = delay;
      star.style.setProperty('--star-min', minOp);
      star.style.setProperty('--star-max', maxOp);
      frag.appendChild(star);
    }
    starsWrap.appendChild(frag);
  }
  spawnStars(window.innerWidth < 500 ? 20 : 35);

  /* SMOOTH MOUSE / TOUCH PARALLAX */
  var canParallax = window.matchMedia('(hover: hover) and (pointer: fine)').matches && !reduceMotion;
  if(canParallax){
    var sunOrb   = document.getElementById('sunOrb');
    var moonOrb  = document.getElementById('moonOrb');
    var planetA  = document.getElementById('planetA');
    var planetB  = document.getElementById('planetB');
    var planetC  = document.getElementById('planetC');
    var targetX = 0, targetY = 0, curX = 0, curY = 0;
    var raf = null;

    window.addEventListener('mousemove', function(e){
      targetX = (e.clientX / window.innerWidth  - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
      if(!raf){ raf = requestAnimationFrame(tick); }
    });

    function tick(){
      curX += (targetX - curX) * 0.05;
      curY += (targetY - curY) * 0.05;

      setPos(sunOrb,  curX * -12, curY * -10);
      setPos(moonOrb, curX * -16, curY * -12);
      setPos(planetA, curX * 18,  curY * 14);
      setPos(planetB, curX * 12,  curY * 10);
      setPos(planetC, curX * 22,  curY * 16);

      if(Math.abs(targetX - curX) > 0.001 || Math.abs(targetY - curY) > 0.001){
        raf = requestAnimationFrame(tick);
      } else {
        raf = null;
      }
    }

    function setPos(el, x, y){
      if(el) {
        el.style.setProperty('--px', x.toFixed(2) + 'px');
        el.style.setProperty('--py', y.toFixed(2) + 'px');
      }
    }
  }
})();
</script>

</body>
</html>
