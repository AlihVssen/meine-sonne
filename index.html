<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Our Sticky Love</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">

<style>

:root {
    --cream: #fbf3e2;
    --cream-deep: #f3e6c8;
    --gold-pale: #ead6a0;
    --gold: #d9a85c;
    --gold-deep: #b8823f;
    --orange-soft: #d98e52;

    --off-white: #fffcf5;
    --ink: #5c3d21;
    --ink-soft: #8a6a45;

    --sky-top: #f6e2c6;

    --sun-core: #fff6de;
    --sun-mid: #f9ce7c;
    --sun-edge: #e39a55;

    --moon-body: #fbf3de;
    --moon-shade: #e4cda0;

    --dune-back: #efcb9c;
    --dune-mid: #e0a96e;
    --dune-front: #c9814a;
    --dune-deep: #9e5f32;

    --shadow: 120,82,34;
    --glow: 255,232,186;

    --ease: cubic-bezier(.22,1,.36,1);
}

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    position: relative;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            180deg,
            #f3dcc2 0%,
            #f6e4c9 24%,
            #f8ead3 46%,
            #fbefd9 60%,
            #f2ce9e 79%,
            #c9683b 100%
        );

    font-family: "Amiri", serif;

    -webkit-font-smoothing: antialiased;

    touch-action: manipulation;
    user-select: none;
}

/* =========================
   ATMOSPHERE
========================= */

.ambient-wash {
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;

    filter: blur(75px);

    opacity: .45;

    background:
        radial-gradient(
            circle at 20% 28%,
            rgba(233,178,140,.55),
            transparent 42%
        ),
        radial-gradient(
            circle at 78% 18%,
            rgba(217,168,92,.4),
            transparent 45%
        ),
        radial-gradient(
            circle at 60% 82%,
            rgba(201,129,74,.35),
            transparent 50%
        );

    animation: ambientMove 38s ease-in-out infinite alternate;
}

@keyframes ambientMove {
    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(2.5%,-2%) scale(1.06);
    }
}

.sun-glow {
    position: fixed;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(var(--glow),.7) 0%,
            rgba(var(--glow),.3) 30%,
            rgba(var(--glow),0) 66%
        );

    opacity: .7;

    animation: glowBreath 12s ease-in-out infinite;
}

@keyframes glowBreath {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* =========================
   STARS
========================= */

.sky {
    position: fixed;
    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;
}

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    border-radius: 50%;

    background: rgba(255,250,235,1);

    box-shadow:
        0 0 5px rgba(255,250,235,.8);

    animation:
        twinkle
        var(--duration)
        ease-in-out
        infinite
        alternate;
}

@keyframes twinkle {
    from {
        opacity: var(--min);
        transform: scale(.85);
    }

    to {
        opacity: var(--max);
        transform: scale(1.2);
    }
}

/* =========================
   SUN
========================= */

.sun-container {
    position: fixed;

    left: 50%;
    bottom: 11vh;

    width: 0;
    height: 0;

    z-index: 1;

    animation:
        sunFloat
        34s
        ease-in-out
        infinite
        alternate;
}

@keyframes sunFloat {

    0% {
        transform:
            translateX(-50%)
            translateY(0)
            rotate(-4deg);
    }

    50% {
        transform:
            translateX(-50%)
            translateY(-18px)
            rotate(3deg);
    }

    100% {
        transform:
            translateX(-50%)
            translateY(8px)
            rotate(-2deg);
    }
}

.sun {
    position: absolute;

    top: 50%;
    left: 50%;

    width: clamp(180px,36vw,320px);
    height: clamp(180px,36vw,320px);

    transform:
        translate(-50%,-50%)
        translate(var(--px,0px),var(--py,0px));
}

.sun-rays {
    position: absolute;

    inset: -90%;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(249,206,124,.45) 0deg 5deg,
            transparent 5deg 20deg
        );

    filter: blur(2px);

    opacity: .8;

    animation:
        rotateSun
        75s
        linear
        infinite;
}

.sun-rays-inner {
    position: absolute;

    inset: -50%;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from 10deg,
            rgba(255,232,186,.35) 0deg 8deg,
            transparent 8deg 24deg
        );

    filter: blur(1px);

    opacity: .7;

    animation:
        rotateSunReverse
        52s
        linear
        infinite;
}

@keyframes rotateSun {
    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateSunReverse {
    to {
        transform: rotate(-360deg);
    }
}

.sun-corona {
    position: absolute;

    inset: -40%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,246,222,.95) 0%,
            rgba(249,206,124,.4) 45%,
            rgba(249,206,124,0) 75%
        );

    animation:
        sunCorona
        8s
        ease-in-out
        infinite
        alternate;
}

@keyframes sunCorona {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

.sun-core {
    position: absolute;

    inset: 20%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 38% 32%,
            var(--sun-core) 0%,
            var(--sun-mid) 55%,
            var(--sun-edge) 100%
        );

    box-shadow:
        0 0 50px rgba(249,206,124,.7),
        inset 0 0 20px rgba(255,255,255,.8);

    animation:
        sunPulse
        7s
        ease-in-out
        infinite
        alternate;
}

@keyframes sunPulse {
    from {
        transform: scale(1);
        filter: brightness(1);
    }

    to {
        transform: scale(1.04);
        filter: brightness(1.1);
    }
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;

    top: 10%;
    right: 10%;

    width: clamp(50px,11vw,85px);
    height: clamp(50px,11vw,85px);

    opacity: .9;

    transform:
        translate(var(--px,0px),var(--py,0px));
}

.moon-inner {
    position: absolute;
    inset: 0;

    animation:
        moonFloat
        18s
        ease-in-out
        infinite
        alternate;
}

.moon-body {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 38% 34%,
            var(--moon-body) 0%,
            var(--moon-shade) 75%
        );

    box-shadow:
        0 0 25px rgba(251,243,222,.65);
}

.moon-shadow {
    position: absolute;

    top: -6%;
    left: 24%;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background: var(--sky-top);
}

@keyframes moonFloat {

    from {
        transform:
            translateY(0)
            rotate(0deg);
    }

    to {
        transform:
            translateY(-14px)
            rotate(-6deg);
    }
}

/* =========================
   PLANETS
========================= */

.planet {
    position: absolute;

    transform:
        translate(var(--px,0px),var(--py,0px));
}

.planet-body {
    position: absolute;

    inset: 0;

    border-radius: 50%;

    animation:
        planetFloat
        var(--duration)
        ease-in-out
        infinite
        alternate;
}

.planet-ring {
    position: absolute;

    inset: -45% -12%;

    border-radius: 50%;

    border-top:
        2.5px solid
        var(--ring);

    border-bottom:
        2px solid
        transparent;

    transform:
        rotate(-22deg)
        scaleY(.38);

    animation:
        ringMove
        34s
        ease-in-out
        infinite;
}

.planet-a {
    top: 58%;
    left: 7%;

    width: clamp(34px,7vw,52px);
    height: clamp(34px,7vw,52px);
}

.planet-a .planet-body {
    --ring: #e8b98c;
    --duration: 22s;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f1b98f,
            #d98e6b 75%
        );

    box-shadow:
        inset -6px -6px 14px rgba(0,0,0,.18),
        0 0 20px rgba(217,142,107,.4);
}

.planet-b {
    top: 14%;
    left: 78%;

    width: clamp(24px,5vw,36px);
    height: clamp(24px,5vw,36px);
}

.planet-b .planet-body {
    --ring: #ebd9a9;
    --duration: 28s;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e9d6a6,
            #c9a66b 75%
        );

    box-shadow:
        inset -5px -5px 10px rgba(0,0,0,.15),
        0 0 16px rgba(201,166,107,.4);
}

.planet-c {
    top: 32%;
    left: 5%;

    width: clamp(28px,6vw,42px);
    height: clamp(28px,6vw,42px);
}

.planet-c .planet-body {
    --ring: #e7c9b9;
    --duration: 25s;

    background:
        radial-gradient(
            circle at 35% 30%,
            #e4c3ba,
            #b98a82 75%
        );

    box-shadow:
        inset -5px -5px 12px rgba(0,0,0,.15),
        0 0 18px rgba(185,138,130,.35);
}

@keyframes planetFloat {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(10px,-18px)
            scale(1.05);
    }
}

@keyframes ringMove {

    0% {
        transform:
            rotate(-22deg)
            scaleY(.38);
    }

    50% {
        transform:
            rotate(-15deg)
            scaleY(.42);
    }

    100% {
        transform:
            rotate(-22deg)
            scaleY(.38);
    }
}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star {
    position: absolute;

    top: 12%;
    left: 60%;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px 1px white;

    opacity: 0;

    animation:
        shooting
        11s
        ease-in
        infinite;
}

.shooting-star::before {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 80px;
    height: 1.5px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.9),
            transparent
        );

    transform:
        translateY(-50%);
}

.shooting-star.two {
    top: 28%;
    left: 25%;

    animation-delay: 3.5s;
    animation-duration: 14s;
}

.shooting-star.three {
    top: 8%;
    left: 45%;

    animation-delay: 6.8s;
    animation-duration: 17s;
}

@keyframes shooting {

    0% {
        opacity: 0;
        transform:
            translate(0,0)
            rotate(22deg);
    }

    2% {
        opacity: 1;
    }

    12% {
        opacity: 0;
        transform:
            translate(-180px,100px)
            rotate(22deg);
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   LANDSCAPE
========================= */

.horizon {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 40vh;

    z-index: 2;

    overflow: hidden;

    pointer-events: none;
}

.horizon-glow {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 140%;
    height: 70%;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse at 50% 100%,
            rgba(255,232,186,.65) 0%,
            rgba(249,206,124,.25) 40%,
            transparent 72%
        );
}

.dune {
    position: absolute;

    left: -5%;
    right: -5%;
    bottom: 0;
}

.dune.one {
    height: 72%;

    opacity: .55;

    background:
        linear-gradient(
            180deg,
            rgba(239,203,156,0),
            var(--dune-back)
        );

    clip-path:
        polygon(
            0 100%,
            0 46%,
            9% 40%,
            20% 50%,
            32% 34%,
            45% 46%,
            58% 28%,
            71% 42%,
            84% 24%,
            94% 38%,
            100% 30%,
            100% 100%
        );
}

.dune.two {
    height: 52%;

    opacity: .8;

    background:
        linear-gradient(
            180deg,
            var(--dune-mid),
            var(--dune-front)
        );

    clip-path:
        polygon(
            0 100%,
            0 58%,
            12% 50%,
            24% 62%,
            38% 44%,
            52% 60%,
            66% 40%,
            80% 56%,
            90% 46%,
            100% 54%,
            100% 100%
        );
}

.dune.three {
    height: 32%;

    background:
        linear-gradient(
            180deg,
            var(--dune-front),
            var(--dune-deep)
        );

    clip-path:
        polygon(
            0 100%,
            0 66%,
            15% 58%,
            30% 70%,
            46% 54%,
            62% 68%,
            78% 50%,
            90% 64%,
            100% 56%,
            100% 100%
        );
}

/* =========================
   VIGNETTE + GRAIN
========================= */

.vignette {
    position: fixed;
    inset: 0;

    z-index: 20;

    pointer-events: none;

    box-shadow:
        inset 0 0 18vw
        rgba(120,66,30,.16);
}

.grain {
    position: fixed;
    inset: 0;

    z-index: 21;

    pointer-events: none;

    opacity: .045;

    mix-blend-mode: overlay;

    background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* =========================
   ENVELOPE STAGE
========================= */

.stage {
    position: relative;

    z-index: 10;

    width: min(92vw,480px);
    height: min(92vw,480px);

    display: flex;

    align-items: center;
    justify-content: center;

    perspective: 1800px;
}

.envelope {
    position: relative;

    width: min(80vw,350px);

    aspect-ratio: 3 / 2;

    transform-style: preserve-3d;

    transition:
        transform
        1.2s
        var(--ease);
}

.stage:hover .envelope {
    transform:
        translateY(-5px)
        scale(1.015);
}

/* =========================
   ENVELOPE FACE
========================= */

.envelope-face {
    position: absolute;
    inset: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            160deg,
            var(--cream),
            var(--gold-pale)
        );

    box-shadow:
        0 4px 10px rgba(var(--shadow),.12),
        0 20px 45px rgba(var(--shadow),.25),
        inset 0 0 0 1px rgba(255,255,255,.5);

    z-index: 2;

    overflow: hidden;
}

.envelope-face::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,.3),
            transparent 40%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(184,130,63,.15),
            transparent 45%
        );
}

/* =========================
   LETTER
========================= */

.paper {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 88%;
    min-height: 122%;

    padding:
        clamp(22px,6vw,42px)
        clamp(18px,5vw,34px);

    background:
        linear-gradient(
            175deg,
            var(--off-white),
            var(--cream)
        );

    border-radius: 6px;

    box-shadow:
        0 4px 8px rgba(var(--shadow),.1),
        0 35px 65px rgba(var(--shadow),.32);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    z-index: 3;

    opacity: 0;

    transform:
        translate(-50%,-46%)
        translateZ(-60px)
        scale(.88)
        rotateX(-6deg);

    transition:
        opacity .65s ease,
        transform 1.75s var(--ease);

    pointer-events: none;
}

.paper::after {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 6px;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(217,168,92,.12),
            transparent 40%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(217,168,92,.12),
            transparent 40%
        );

    pointer-events: none;
}

body.opened .paper {
    opacity: 1;

    z-index: 10;

    transform:
        translate(-50%,-86%)
        translateZ(70px)
        scale(1)
        rotateX(0deg);

    transition-delay: .15s;

    pointer-events: auto;
}

.poem {
    direction: rtl;

    font-family:
        "Aref Ruqaa",
        "Amiri",
        serif;

    color: var(--ink);

    font-size:
        clamp(18px,3.8vw,26px);

    font-weight: 700;

    line-height: 2.1;

    opacity: 0;

    transform:
        translateY(14px);

    transition:
        opacity 1.35s ease,
        transform 1.35s var(--ease);
}

body.opened .poem {
    opacity: 1;

    transform:
        translateY(0);

    transition-delay: .85s;
}

.poem span {
    display: block;
}

.poem span + span {
    margin-top: .6em;
}

.close-hint {
    margin-top: 15px;

    font-family: Arial,sans-serif;

    font-size: 11px;

    color: var(--ink-soft);

    opacity: .65;

    direction: ltr;
}

/* =========================
   FLAP
========================= */

.flap {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 64%;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 92%
        );

    transform-origin:
        50% 0%;

    transform-style:
        preserve-3d;

    transition:
        transform
        1.45s
        var(--ease);

    z-index: 4;
}

.flap-front,
.flap-back {
    position: absolute;

    inset: 0;

    backface-visibility: hidden;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 92%
        );
}

.flap-front {
    background:
        linear-gradient(
            200deg,
            var(--gold-pale),
            var(--gold)
        );
}

.flap-back {
    background:
        linear-gradient(
            200deg,
            var(--cream),
            var(--gold-pale)
        );

    transform:
        rotateX(180deg);
}

body.opened .flap {
    transform:
        rotateX(-160deg);
}

/* =========================
   SEAL BUTTON
========================= */

.seal {
    all: unset;

    position: absolute;

    top: 50%;
    left: 50%;

    width: clamp(48px,13vw,62px);
    height: clamp(48px,13vw,62px);

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    cursor: pointer;

    z-index: 6;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        transform .5s var(--ease),
        opacity .4s ease;
}

.seal::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            var(--orange-soft),
            var(--gold-deep) 55%,
            #9c6a2e
        );

    box-shadow:
        0 4px 10px rgba(var(--shadow),.4),
        inset 0 1px 2px rgba(255,255,255,.5);
}

.seal::after {
    content: "☀";

    position: relative;

    color: #fff7e6;

    font-size: 18px;

    text-shadow:
        0 1px 2px rgba(0,0,0,.3);
}

.seal:hover {
    transform:
        translate(-50%,-50%)
        scale(1.12);
}

body:not(.opened) .seal {
    animation:
        sealPulse
        2.8s
        ease-in-out
        infinite;
}

@keyframes sealPulse {

    0%,100% {
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%,-50%)
            scale(1.05);
    }
}

body.opened .seal {
    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-180%)
        rotate(90deg)
        scale(.5);
}

/* =========================
   PARTICLES
========================= */

.particles {
    position: absolute;

    inset: -10%;

    pointer-events: none;

    z-index: 8;

    opacity: 0;

    transition:
        opacity 1.2s ease;
}

body.opened .particles {
    opacity: 1;
}

.mote {
    position: absolute;

    bottom: -4%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,244,214,.95),
            rgba(217,168,92,0)
        );

    animation:
        floatUp
        var(--duration)
        ease-in-out
        infinite;
}

@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            translateX(0);

        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    50% {
        transform:
            translateY(-55vh)
            translateX(var(--drift));
    }

    85% {
        opacity: .4;
    }

    100% {
        transform:
            translateY(-100vh)
            translateX(0);

        opacity: 0;
    }
}

/* =========================================================
   GLASS MUSIC PLAYER
========================================================= */

.music-player {
    position: fixed;

    left: 50%;
    bottom:
        max(18px,env(safe-area-inset-bottom));

    transform:
        translateX(-50%);

    z-index: 50;

    width:
        min(92vw,430px);

    padding:
        12px 14px 13px;

    border:
        1px solid
        rgba(255,255,255,.42);

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.30),
            rgba(255,244,220,.15)
        );

    box-shadow:
        0 14px 38px
        rgba(91,57,28,.18),

        inset 0 1px 0
        rgba(255,255,255,.45);

    backdrop-filter:
        blur(18px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

    color: #5c3d21;

    user-select: none;
}

.music-player::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.16),
            transparent 42%,
            rgba(255,255,255,.06)
        );
}

/* TOP */

.music-top {
    position: relative;

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;
}

.music-disc {
    width: 34px;
    height: 34px;

    flex:
        0 0 34px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff6df 0 8%,
            #d9a85c 9% 42%,
            #b8823f 43% 100%
        );

    box-shadow:
        0 3px 10px
        rgba(120,82,34,.22);
}

.music-disc::after {
    content: "";

    display: block;

    width: 7px;
    height: 7px;

    position: relative;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background: #fff7e7;

    box-shadow:
        0 0 0 3px
        rgba(184,130,63,.35);
}

.music-player.playing .music-disc {
    animation:
        discSpin
        7s
        linear
        infinite;
}

@keyframes discSpin {
    to {
        transform:
            rotate(360deg);
    }
}

.music-meta {
    min-width: 0;

    flex: 1;

    text-align: left;

    direction: ltr;
}

.music-title {
    font-family:
        Arial,
        sans-serif;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: .08em;

    color: #684625;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.music-subtitle {
    margin-top: 2px;

    font-family:
        Arial,
        sans-serif;

    font-size: 10px;

    color:
        rgba(92,61,33,.68);
}

.music-time {
    font-family:
        Arial,
        sans-serif;

    font-size: 10px;

    color:
        rgba(92,61,33,.72);

    direction: ltr;

    white-space: nowrap;
}

/* PROGRESS */

.music-progress {
    position: relative;

    z-index: 2;

    width: 100%;

    height: 4px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 99px;

    outline: none;

    cursor: pointer;

    background:
        rgba(107,74,43,.16);

    margin:
        0 0 10px;
}

.music-progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background:
        #b8823f;

    border:
        2px solid
        rgba(255,252,245,.9);

    box-shadow:
        0 2px 7px
        rgba(91,57,28,.22);
}

.music-progress::-moz-range-thumb {
    width: 11px;
    height: 11px;

    border-radius: 50%;

    background:
        #b8823f;

    border:
        2px solid
        rgba(255,252,245,.9);
}

/* CONTROLS */

.music-controls {
    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;
}

.music-btn {
    all: unset;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    display: grid;

    place-items: center;

    cursor: pointer;

    color:
        #684625;

    background:
        rgba(255,252,245,.24);

    border:
        1px solid
        rgba(255,255,255,.34);

    box-shadow:
        0 4px 12px
        rgba(91,57,28,.08),

        inset 0 1px 0
        rgba(255,255,255,.35);

    transition:
        transform .35s var(--ease),
        background .35s ease,
        box-shadow .35s ease;
}

.music-btn:hover {
    transform:
        translateY(-2px)
        scale(1.04);

    background:
        rgba(255,252,245,.42);

    box-shadow:
        0 7px 18px
        rgba(91,57,28,.13),

        inset 0 1px 0
        rgba(255,255,255,.48);
}

.music-btn:active {
    transform:
        scale(.94);
}

.music-btn.main {
    width: 42px;
    height: 42px;

    background:
        rgba(255,249,232,.45);
}

.music-btn svg {
    width: 15px;
    height: 15px;

    fill: currentColor;
}

/* VOLUME */

.volume-wrap {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-left: 5px;

    padding-left: 9px;

    border-left:
        1px solid
        rgba(107,74,43,.13);
}

.volume-icon {
    width: 15px;
    height: 15px;

    color:
        #684625;

    opacity: .82;
}

.volume-slider {
    width: 70px;
    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 99px;

    background:
        rgba(107,74,43,.16);

    outline: none;

    cursor: pointer;
}

.volume-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        #b8823f;

    border:
        2px solid
        rgba(255,252,245,.9);
}

.volume-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        #b8823f;

    border:
        2px solid
        rgba(255,252,245,.9);
}

/* HIDDEN AUDIO */

#audio {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    .music-player {
        width:

        bottom:

@media (max-width: 420px) {

    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}

<!-- ======================================================
     JAVASCRIPT

<script>

(function () {

    "use strict";


    /* =====================================================
       BASIC ELEMENTS
    ===================================================== */

    const body =
        document.body;

    const stage =
        document.getElementById("mainStage");

    const seal =
        document.getElementById("seal");

    const particles =
        document.getElementById("particles");


    let opened = false;


    /* =====================================================
       LETTER OPEN / CLOSE
    ===================================================== */

    function toggleLetter(event) {

        if (event) {
            event.stopPropagation();
        }

        opened = !opened;

        if (opened) {

            body.classList.add("opened");

            createParticles();

        } else {

            body.classList.remove("opened");

        }

    }


    seal.addEventListener(
        "click",
        toggleLetter
    );


    stage.addEventListener(
        "click",
        function (event) {

            /*
             * Don't close the letter when the user
             * clicks the music player.
             */

            if (
                event.target.closest &&
                event.target.closest(".music-player")
            ) {
                return;
            }

            toggleLetter(event);

        }
    );


    /* =====================================================
       KEYBOARD
    ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                opened
            ) {

                opened = false;

                body.classList.remove(
                    "opened"
                );

                return;
            }

            if (
                event.key === "Enter"
            ) {

                toggleLetter();

            }

        }
    );


    /* =====================================================
       PARTICLES
    ===================================================== */

    function createParticles() {

        if (
            particles.children.length > 0
        ) {
            return;
        }

        const count =
            window.innerWidth < 500
                ? 14
                : 22;


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const mote =
                document.createElement(
                    "span"
                );

            mote.className =
                "mote";


            const size =
                2 +
                Math.random() * 3.5;


            const duration =
                5 +
                Math.random() * 5;


            const delay =
                Math.random() * 5;


            const drift =
                (
                    Math.random() * 30 -
                    15
                ).toFixed(0);


            mote.style.left =
                Math.random() * 100 +
                "%";

            mote.style.width =
                size + "px";

            mote.style.height =
                size + "px";

            mote.style.setProperty(
                "--duration",
                duration + "s"
            );

            mote.style.setProperty(
                "--drift",
                drift + "px"
            );

            mote.style.animationDelay =
                delay + "s";


            particles.appendChild(
                mote
            );

        }

    }


    /* =====================================================
       STARS
    ===================================================== */

    const stars =
        document.getElementById(
            "stars"
        );


    function createStars(count) {

        const fragment =
            document.createDocumentFragment();


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "star";


            const size =
                1.2 +
                Math.random() * 2;


            const duration =
                2 +
                Math.random() * 3.5;


            const delay =
                Math.random() * 4;


            const minOpacity =
                .1 +
                Math.random() * .25;


            const maxOpacity =
                .6 +
                Math.random() * .4;


            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            star.style.top =
                Math.random() * 90 +
                "%";

            star.style.left =
                Math.random() * 100 +
                "%";


            star.style.setProperty(
                "--duration",
                duration + "s"
            );

            star.style.setProperty(
                "--min",
                minOpacity
            );

            star.style.setProperty(
                "--max",
                maxOpacity
            );


            star.style.animationDelay =
                delay + "s";


            fragment.appendChild(
                star
            );

        }


        stars.appendChild(
            fragment
        );

    }


    createStars(
        window.innerWidth < 500
            ? 20
            : 35
    );


    /* =====================================================
       MUSIC PLAYER
    ===================================================== */

    const audio =
        document.getElementById(
            "audio"
        );

    const musicPlayer =
        document.getElementById(
            "musicPlayer"
        );

    const playPause =
        document.getElementById(
            "playPause"
        );

    const playIcon =
        document.getElementById(
            "playIcon"
        );

    const pauseIcon =
        document.getElementById(
            "pauseIcon"
        );

    const back10 =
        document.getElementById(
            "back10"
        );

    const forward10 =
        document.getElementById(
            "forward10"
        );

    const progress =
        document.getElementById(
            "progress"
        );

    const volume =
        document.getElementById(
            "volume"
        );

    const currentTime =
        document.getElementById(
            "currentTime"
        );

    const duration =
        document.getElementById(
            "duration"
        );


    /* =====================================================
       INITIAL VOLUME
    ===================================================== */

    audio.volume =
        0.55;


    /* =====================================================
       TIME FORMAT
    ===================================================== */

    function formatTime(seconds) {

        if (
            !Number.isFinite(
                seconds
            ) ||
            seconds < 0
        ) {
            return "0:00";
        }


        const minutes =
            Math.floor(
                seconds / 60
            );


        const secondsPart =
            Math.floor(
                seconds % 60
            )
            .toString()
            .padStart(2,"0");


        return (
            minutes +
            ":" +
            secondsPart
        );

    }


    /* =====================================================
       UPDATE PLAY / PAUSE UI
    ===================================================== */

    function updatePlayState() {

        const playing =
            !audio.paused;


        musicPlayer.classList.toggle(
            "playing",
            playing
        );


        playIcon.style.display =
            playing
                ? "none"
                : "block";


        pauseIcon.style.display =
            playing
                ? "block"
                : "none";


        playPause.setAttribute(
            "aria-label",
            playing
                ? "Pause"
                : "Play"
        );

    }


    /* =====================================================
       UPDATE PROGRESS
    ===================================================== */

    function updateProgress() {

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );


        if (
            Number.isFinite(
                audio.duration
            ) &&
            audio.duration > 0
        ) {

            progress.value =
                (
                    audio.currentTime /
                    audio.duration
                ) * 1000;

        }

    }


    /* =====================================================
       PLAY / PAUSE BUTTON
    ===================================================== */

    playPause.addEventListener(
        "click",
        async function (event) {

            event.stopPropagation();

            try {

                if (audio.paused) {

                    await audio.play();

                } else {

                    audio.pause();

                }

            } catch (error) {

                console.error(
                    "Audio playback error:",
                    error
                );

            }

        }
    );


    /* =====================================================
       BACK 10 SECONDS
    ===================================================== */

    back10.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            audio.currentTime =
                Math.max(
                    0,
                    audio.currentTime - 10
                );

        }
    );


    /* =====================================================
       FORWARD 10 SECONDS
    ===================================================== */

    forward10.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();


            if (
                Number.isFinite(
                    audio.duration
                )
            ) {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 10
                    );

            } else {

                audio.currentTime += 10;

            }

        }
    );


    /* =====================================================
       SEEK BAR
    ===================================================== */

    progress.addEventListener(
        "input",
        function (event) {

            event.stopPropagation();


            if (
                Number.isFinite(
                    audio.duration
                ) &&
                audio.duration > 0
            ) {

                audio.currentTime =
                    (
                        Number(
                            progress.value
                        ) / 1000
                    ) *
                    audio.duration;

            }

        }
    );


    /* =====================================================
       VOLUME
    ===================================================== */

    volume.addEventListener(
        "input",
        function (event) {

            event.stopPropagation();


            audio.volume =
                Number(
                    volume.value
                ) / 100;

        }
    );


    /* =====================================================
       STOP MUSIC PLAYER CLICK
       FROM REACHING THE LETTER
    ===================================================== */

    [
        "click",
        "pointerdown",
        "mousedown",
        "touchstart"
    ].forEach(
        function (eventName) {

            musicPlayer.addEventListener(
                eventName,
                function (event) {

                    event.stopPropagation();

                }
            );

        }
    );


    /* =====================================================
       AUDIO EVENTS
    ===================================================== */

    audio.addEventListener(
        "play",
        updatePlayState
    );

    audio.addEventListener(
        "pause",
        updatePlayState
    );

    audio.addEventListener(
        "timeupdate",
        updateProgress
    );

    audio.addEventListener(
        "loadedmetadata",
        updateProgress
    );

    audio.addEventListener(
        "durationchange",
        updateProgress
    );


    audio.addEventListener(
        "ended",
        function () {

            updatePlayState();

            progress.value = 0;

        }
    );


    /* =====================================================
       AUDIO ERROR
    ===================================================== */

    audio.addEventListener(
        "error",
        function () {

            console.error(
                "Could not load 1.mp3"
            );

        }
    );


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    updatePlayState();


    /* =====================================================
       PARALLAX
    ===================================================== */

    const canParallax =
        window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        ).matches;


    if (canParallax) {

        const sun =
            document.getElementById(
                "sun"
            );

        const moon =
            document.getElementById(
                "moon"
            );

        const planetA =
            document.getElementById(
                "planetA"
            );

        const planetB =
            document.getElementById(
                "planetB"
            );

        const planetC =
            document.getElementById(
                "planetC"
            );


        let targetX = 0;
        let targetY = 0;

        let currentX = 0;
        let currentY = 0;

        let animationFrame = null;


        window.addEventListener(
            "mousemove",
            function (event) {

                targetX =
                    (
                        event.clientX /
                        window.innerWidth -
                        .5
                    ) * 2;


                targetY =
                    (
                        event.clientY /
                        window.innerHeight -
                        .5
                    ) * 2;


                if (
                    !animationFrame
                ) {

                    animationFrame =
                        requestAnimationFrame(
                            animateParallax
                        );

                }

            }
        );


        function setPosition(
            element,
            x,
            y
        ) {

            if (!element) {
                return;
            }


            element.style.setProperty(
                "--px",
                x.toFixed(2) + "px"
            );


            element.style.setProperty(
                "--py",
                y.toFixed(2) + "px"
            );

        }


        function animateParallax() {

            currentX +=
                (
                    targetX -
                    currentX
                ) * .045;


            currentY +=
                (
                    targetY -
                    currentY
                ) * .045;


            setPosition(
                sun,
                currentX * -12,
                currentY * -10
            );


            setPosition(
                moon,
                currentX * -16,
                currentY * -12
            );


            setPosition(
                planetA,
                currentX * 18,
                currentY * 14
            );


            setPosition(
                planetB,
                currentX * 12,
                currentY * 10
            );


            setPosition(
                planetC,
                currentX * 22,
                currentY * 16
            );


            if (
                Math.abs(
                    targetX - currentX
                ) > .001 ||

                Math.abs(
                    targetY - currentY
                ) > .001
            ) {

                animationFrame =
                    requestAnimationFrame(
                        animateParallax
                    );

            } else {

                animationFrame =
                    null;

            }

        }

    }

})();

</script>

</body>
</html>
